<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A personal playground of games and tools — all client-side, no installs." />
  <title>Playground</title>
  <link rel="stylesheet" href="./shared/style.css" />
  <style>
    .hub-header {
      padding: calc(56px + 3.5rem) 1.5rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hub-header::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(108,142,247,0.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .hub-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.6rem;
    }
    .hub-sub {
      color: var(--muted);
      font-size: 1rem;
      max-width: 420px;
      margin: 0 auto;
    }
    .tools-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .tools-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 1rem;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
    }
    .featured-ribbon {
      position: absolute; top: 14px; right: -22px;
      background: var(--grad);
      color: #fff; font-size: 0.64rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 3px 32px; transform: rotate(35deg);
    }
    footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
    @media (max-width: 600px) {
      .tools-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { createElement as h, useState } from 'https://esm.sh/react@18.3.1';
    import { createRoot }                   from 'https://esm.sh/react-dom@18.3.1/client';
    import htm                              from 'https://esm.sh/htm@3.1.1';
    import { tools, categories }           from './shared/tools.js';

    const html = htm.bind(h);

    function ToolCard({ tool }) {
      return html`
        <a href=${tool.url} class="tool-card">
          ${tool.featured && html`<div class="featured-ribbon">Featured</div>`}
          <div class="tool-card-icon">${tool.icon}</div>
          <div class="tool-card-title">${tool.title}</div>
          <div class="tool-card-desc">${tool.description}</div>
          <div class="tool-card-footer">
            <span class=${`badge badge-${tool.category}`}>${tool.category}</span>
            <span style=${{ fontSize: '0.83rem', color: 'var(--accent)', fontWeight: 600 }}>
              ${tool.category === 'game' ? 'Play →' : 'Open →'}
            </span>
          </div>
        </a>
      `;
    }

    function App() {
      const [active, setActive] = useState('all');
      const filtered = active === 'all' ? tools : tools.filter(t => t.category === active);

      return html`
        <nav class="pg-nav">
          <span class="pg-nav-logo">Playground</span>
          <div class="filter-bar" style=${{ marginBottom: 0 }}>
            ${categories.map(cat => html`
              <button
                key=${cat}
                class=${`filter-chip ${active === cat ? 'active' : ''}`}
                onClick=${() => setActive(cat)}
              >
                ${cat.charAt(0).toUpperCase() + cat.slice(1)}
              </button>
            `)}
          </div>
        </nav>

        <header class="hub-header">
          <h1 class="hub-title">The <span class="gradient-text">Playground</span></h1>
          <p class="hub-sub">A growing collection of games and tools. All client-side, no installs.</p>
        </header>

        <main class="tools-section">
          ${filtered.length === 0
            ? html`<div class="empty-state">No ${active}s here yet — check back soon.</div>`
            : html`
              <div class="tools-grid">
                ${filtered.map(t => html`<${ToolCard} key=${t.id} tool=${t} />`)}
              </div>
              <p class="tools-meta">${filtered.length} ${filtered.length === 1 ? 'item' : 'items'}</p>
            `
          }
        </main>

        <footer>Built with plain HTML, React via CDN, and no build step.</footer>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
