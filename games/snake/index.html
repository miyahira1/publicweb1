<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake — Playground</title>
  <link rel="stylesheet" href="../../shared/style.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 56px 1rem 1rem;
      gap: 0;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.1rem;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .hud-score { color: var(--text); }
    .hud-hi    { color: var(--muted); font-size: 0.8rem; }

    .canvas-box { position: relative; }

    canvas {
      display: block;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    /* Overlay (start / game-over screens) */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.85rem;
      background: rgba(13, 15, 20, 0.9);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      text-align: center;
      padding: 1.5rem;
    }
    .overlay h2 {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 800;
    }
    .overlay .final-score {
      font-size: clamp(2.8rem, 10vw, 4rem);
      font-weight: 800;
      line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .overlay .hint {
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 240px;
    }
    .overlay .new-best {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .overlay .btn + .btn { margin-top: 0.25rem; }

    /* D-pad (touch devices) */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      grid-template-columns: 62px 62px 62px;
      grid-template-rows:    62px 62px 62px;
      gap: 5px;
      margin-top: 1rem;
    }
    .dpad-btn {
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
      transition: background var(--trans);
    }
    .dpad-btn:active { background: var(--border2); }
    .dpad-up    { grid-area: up; }
    .dpad-left  { grid-area: left; }
    .dpad-right { grid-area: right; }
    .dpad-down  { grid-area: down; }

    .speed-label {
      font-size: 0.74rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import {
      createElement as h, useState, useEffect, useRef, useCallback,
    } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import htm             from 'https://esm.sh/htm@3.1.1';
    import { playTone, storageGet, storageSet, lerp, clamp, randInt }
      from '../../shared/utils.js';

    const html = htm.bind(h);

    // ── ctx.roundRect polyfill (Safari < 15.4, older Chrome) ─────────────────
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y,     x + w, y + h, r);
        this.arcTo(x + w, y + h, x,     y + h, r);
        this.arcTo(x,     y + h, x,     y,     r);
        this.arcTo(x,     y,     x + w, y,     r);
        this.closePath();
      };
    }

    // ── Constants ─────────────────────────────────────────────────────────────
    const GRID       = 20;
    const TICK_START = 145;   // ms between moves (starting speed)
    const TICK_MIN   = 55;    // ms at maximum speed
    const TICK_ACCEL = 10;    // ms reduction every SPEED_EVERY food
    const SPEED_EVERY = 5;
    const TOOL_ID    = 'snake';

    // ── Sound effects ─────────────────────────────────────────────────────────
    const sfx = {
      eat() {
        playTone({ freq: 523, type: 'triangle', duration: 0.09, gain: 0.22 });
        playTone({ freq: 659, type: 'triangle', duration: 0.09, gain: 0.18, delay: 0.07 });
      },
      speedUp() {
        playTone({ freq: 784, type: 'sine', duration: 0.1, gain: 0.18 });
        playTone({ freq: 988, type: 'sine', duration: 0.1, gain: 0.15, delay: 0.09 });
      },
      die() {
        [392, 349, 294, 261].forEach((freq, i) =>
          playTone({ freq, type: 'sawtooth', duration: 0.2, gain: 0.18, delay: i * 0.1 })
        );
      },
    };

    // ── GameEngine ────────────────────────────────────────────────────────────
    class GameEngine {
      constructor(canvas, cellSize, { onScore, onDie, onSpeedUp }) {
        this.canvas     = canvas;
        this.ctx        = canvas.getContext('2d');
        this.cellSize   = cellSize;
        this.onScore    = onScore;
        this.onDie      = onDie;
        this.onSpeedUp  = onSpeedUp;
        this._boundLoop = this._loop.bind(this);
        this.reset();
      }

      reset() {
        const m = Math.floor(GRID / 2);
        this.snake     = [{ x: m + 1, y: m }, { x: m, y: m }, { x: m - 1, y: m }];
        this.prevSnake = this.snake.map(s => ({ ...s }));
        this.dir       = { x: 1, y: 0 };
        this.nextDir   = { x: 1, y: 0 };
        this.food      = this._placeFood();
        this.score     = 0;
        this.foodCount = 0;
        this.tickMs    = TICK_START;
        this.particles = [];
        this.flashAlpha = 0;
        this.lerpT      = 0;
        this.accumulator = 0;
        this.lastTime    = 0;
        this.alive       = true;
      }

      start() {
        this.lastTime = performance.now();
        this.rafId    = requestAnimationFrame(this._boundLoop);
      }

      stop() {
        if (this.rafId) cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }

      setDir(dx, dy) {
        if (dx === -this.dir.x && dy === -this.dir.y) return; // no 180°
        this.nextDir = { x: dx, y: dy };
      }

      // ── Loop ──
      _loop(ts) {
        if (!this.alive) return;
        const delta = Math.min(ts - this.lastTime, 200);
        this.lastTime = ts;

        this.accumulator += delta;
        this.lerpT = clamp(this.lerpT + delta / this.tickMs, 0, 1);

        while (this.accumulator >= this.tickMs) {
          this.accumulator -= this.tickMs;
          this._tick();
          if (!this.alive) { this._draw(1); return; }
        }

        if (this.flashAlpha > 0)
          this.flashAlpha = Math.max(0, this.flashAlpha - delta / 250);
        this._updateParticles(delta);
        this._draw(this.lerpT);
        this.rafId = requestAnimationFrame(this._boundLoop);
      }

      _tick() {
        this.prevSnake = this.snake.map(s => ({ ...s }));
        this.lerpT = 0;
        this.dir = this.nextDir;

        const head = this.snake[0];
        const nx = head.x + this.dir.x;
        const ny = head.y + this.dir.y;

        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) { this._die(); return; }
        if (this.snake.some(s => s.x === nx && s.y === ny))  { this._die(); return; }

        this.snake.unshift({ x: nx, y: ny });

        if (nx === this.food.x && ny === this.food.y) {
          this.score++;
          this.foodCount++;
          this._spawnParticles(nx, ny);
          sfx.eat();
          this.food = this._placeFood();
          this.onScore(this.score);

          if (this.foodCount % SPEED_EVERY === 0) {
            this.tickMs = Math.max(TICK_MIN, this.tickMs - TICK_ACCEL);
            sfx.speedUp();
            this.onSpeedUp(this.tickMs);
          }
        } else {
          this.snake.pop();
        }
      }

      _die() {
        this.alive = false;
        this.flashAlpha = 0.65;
        sfx.die();
        this.onDie(this.score);
      }

      _placeFood() {
        const occupied = new Set(this.snake?.map(s => `${s.x},${s.y}`) ?? []);
        let pos;
        do { pos = { x: randInt(0, GRID - 1), y: randInt(0, GRID - 1) }; }
        while (occupied.has(`${pos.x},${pos.y}`));
        return pos;
      }

      _spawnParticles(gx, gy) {
        const cs = this.cellSize;
        const cx = (gx + 0.5) * cs;
        const cy = (gy + 0.5) * cs;
        const palette = ['#6c8ef7', '#a78bfa', '#4ade80', '#fb923c'];
        for (let i = 0; i < 16; i++) {
          const angle = (i / 16) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          const speed = 1.5 + Math.random() * 3;
          this.particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, decay: 0.02 + Math.random() * 0.015,
            r: 1.8 + Math.random() * 2.5,
            color: palette[Math.floor(Math.random() * palette.length)],
          });
        }
      }

      _updateParticles(delta) {
        const s = delta / 16.67; // normalize to 60 fps
        this.particles = this.particles.filter(p => {
          p.x  += p.vx * s; p.y  += p.vy * s;
          p.vx *= 0.92;      p.vy *= 0.92;
          p.life -= p.decay * s;
          return p.life > 0;
        });
      }

      // ── Rendering ──
      _draw(t) {
        const { ctx, canvas, cellSize } = this;
        const W = canvas.width, H = canvas.height;

        // Background
        ctx.fillStyle = '#0d0f14';
        ctx.fillRect(0, 0, W, H);

        // Grid lines (subtle)
        ctx.strokeStyle = 'rgba(37,45,62,0.5)';
        ctx.lineWidth = 0.5;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, H); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(W, i * cellSize); ctx.stroke();
        }

        // Particles
        for (const p of this.particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Food — pulsing glow
        const fx = (this.food.x + 0.5) * cellSize;
        const fy = (this.food.y + 0.5) * cellSize;
        const fp = 1 + 0.1 * Math.sin(Date.now() / 280);
        const fr = cellSize * 0.34 * fp;
        ctx.shadowColor = '#4ade80';
        ctx.shadowBlur  = 12;
        ctx.fillStyle   = '#4ade80';
        ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur  = 0;

        // Snake (drawn back-to-front so head is on top)
        const sn = this.snake;
        for (let i = sn.length - 1; i >= 0; i--) {
          const cur  = sn[i];
          const prev = this.prevSnake[i] ?? cur;
          const ix   = lerp(prev.x, cur.x, t);
          const iy   = lerp(prev.y, cur.y, t);
          const px   = ix * cellSize + 2;
          const py   = iy * cellSize + 2;
          const sz   = cellSize - 4;
          const fade = 1 - (i / sn.length) * 0.55;

          ctx.globalAlpha = fade;

          if (i === 0) {
            const g = ctx.createLinearGradient(px, py, px + sz, py + sz);
            g.addColorStop(0, '#6c8ef7');
            g.addColorStop(1, '#a78bfa');
            ctx.fillStyle = g;
          } else {
            // Body colour fades from accent toward accent2
            const mix = i / sn.length;
            const r = Math.round(lerp(0x6c, 0xa7, mix));
            const g = Math.round(lerp(0x8e, 0x8b, mix));
            const b = Math.round(lerp(0xf7, 0xfa, mix));
            ctx.fillStyle = `rgb(${r},${g},${b})`;
          }

          ctx.beginPath();
          ctx.roundRect(px, py, sz, sz, i === 0 ? sz * 0.36 : sz * 0.24);
          ctx.fill();

          // Eyes on head
          if (i === 0) {
            ctx.globalAlpha = 1;
            ctx.fillStyle   = '#0d0f14';
            const eyeR = sz * 0.11;
            const d    = this.dir;
            let eyes;
            if      (d.x ===  1) eyes = [[0.72, 0.26], [0.72, 0.74]];
            else if (d.x === -1) eyes = [[0.28, 0.26], [0.28, 0.74]];
            else if (d.y === -1) eyes = [[0.26, 0.28], [0.74, 0.28]];
            else                 eyes = [[0.26, 0.72], [0.74, 0.72]];
            for (const [ex, ey] of eyes) {
              ctx.beginPath();
              ctx.arc(px + sz * ex, py + sz * ey, eyeR, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.globalAlpha = 1;

        // Death flash (red overlay)
        if (this.flashAlpha > 0) {
          ctx.fillStyle = `rgba(248,113,113,${this.flashAlpha * 0.45})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function getCanvasSize() {
      const maxW = Math.min(480, window.innerWidth - 32);
      const cell = Math.floor(maxW / GRID);
      return { size: cell * GRID, cell };
    }

    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    // ── React App ─────────────────────────────────────────────────────────────
    function App() {
      const canvasRef = useRef(null);
      const engineRef = useRef(null);
      const touchStart = useRef(null);

      const [screen,     setScreen]     = useState('start');
      const [score,      setScore]      = useState(0);
      const [hiScore,    setHiScore]    = useState(() => storageGet(TOOL_ID, 'hi', 0));
      const [speedLevel, setSpeedLevel] = useState(1);
      const [canvasData] = useState(getCanvasSize);

      // Touch swipe detection
      const onTouchStart = useCallback(e => {
        touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, []);

      const onTouchEnd = useCallback(e => {
        if (!touchStart.current || !engineRef.current) return;
        const dx  = e.changedTouches[0].clientX - touchStart.current.x;
        const dy  = e.changedTouches[0].clientY - touchStart.current.y;
        const adx = Math.abs(dx), ady = Math.abs(dy);
        if (Math.max(adx, ady) < 20) return;
        if (adx > ady) engineRef.current.setDir(dx > 0 ? 1 : -1, 0);
        else           engineRef.current.setDir(0, dy > 0 ? 1 : -1);
        touchStart.current = null;
      }, []);

      // Keyboard input
      useEffect(() => {
        const dirs = {
          ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
          w: [0,-1], s: [0,1], a: [-1,0], d: [1,0],
        };
        const handler = e => {
          if (dirs[e.key]) {
            e.preventDefault();
            if (screen === 'playing') engineRef.current?.setDir(...dirs[e.key]);
          }
          if ((e.key === ' ' || e.key === 'Enter') && (screen === 'start' || screen === 'dead')) {
            startGame();
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [screen]);

      const startGame = useCallback(() => {
        setScore(0);
        setSpeedLevel(1);
        setScreen('playing');

        // defer one tick so React has committed the canvas to the DOM
        setTimeout(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          canvas.width  = canvasData.size;
          canvas.height = canvasData.size;

          engineRef.current?.stop();
          engineRef.current = new GameEngine(canvas, canvasData.cell, {
            onScore: s => setScore(s),
            onDie: final => {
              setHiScore(prev => {
                const next = Math.max(prev, final);
                if (final > 0) storageSet(TOOL_ID, 'hi', next);
                return next;
              });
              setScreen('dead');
            },
            onSpeedUp: tickMs => {
              setSpeedLevel(Math.round((TICK_START - tickMs) / TICK_ACCEL) + 1);
            },
          });
          engineRef.current.start();
        }, 0);
      }, [canvasData]);

      useEffect(() => () => engineRef.current?.stop(), []);

      const dpad = (dx, dy) => engineRef.current?.setDir(dx, dy);

      return html`
        <nav class="pg-nav">
          <a href="../../" class="pg-nav-back">← Hub</a>
          <span class="pg-nav-logo">Snake</span>
          <span class="speed-label">Speed ${speedLevel}</span>
        </nav>

        <div
          class="game-wrap"
          onTouchStart=${onTouchStart}
          onTouchEnd=${onTouchEnd}
        >
          <div class="hud" style=${{ width: canvasData.size + 'px' }}>
            <span class="hud-score">Score: ${score}</span>
            <span class="hud-hi">Best: ${hiScore}</span>
          </div>

          <div class="canvas-box" style=${{ width: canvasData.size + 'px', height: canvasData.size + 'px' }}>
            <canvas
              ref=${canvasRef}
              width=${canvasData.size}
              height=${canvasData.size}
            />

            ${screen === 'start' && html`
              <div class="overlay">
                <h2 class="gradient-text">Snake</h2>
                <p class="hint">
                  ${isTouchDevice
                    ? 'Swipe or use the D-pad to steer.'
                    : 'Arrow keys or WASD to move. Space to start.'
                  }
                </p>
                <button class="btn btn-primary" onClick=${startGame}>Start Game</button>
                ${hiScore > 0 && html`<p class="hint">Best: ${hiScore}</p>`}
              </div>
            `}

            ${screen === 'dead' && html`
              <div class="overlay">
                <h2>Game Over</h2>
                <div class="final-score">${score}</div>
                ${score > 0 && score >= hiScore && html`<p class="new-best">New best!</p>`}
                <p class="hint">Best: ${hiScore}</p>
                <button class="btn btn-primary" onClick=${startGame}>Play Again</button>
                <a href="../../" class="btn btn-ghost" style="margin-top: 0.25rem;">← Back to Hub</a>
              </div>
            `}
          </div>

          ${isTouchDevice && screen === 'playing' && html`
            <div class="dpad">
              <button class="dpad-btn dpad-up"    onPointerDown=${() => dpad(0, -1)}>▲</button>
              <button class="dpad-btn dpad-left"  onPointerDown=${() => dpad(-1, 0)}>◀</button>
              <button class="dpad-btn dpad-right" onPointerDown=${() => dpad(1, 0)}>▶</button>
              <button class="dpad-btn dpad-down"  onPointerDown=${() => dpad(0, 1)}>▼</button>
            </div>
          `}
        </div>
      `;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
